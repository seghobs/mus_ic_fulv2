<div id="aiLyricsModal" class="modal-backdrop hidden">
    <div class="modal-card fade-in" style="max-width:500px">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h3 class="text-xl font-bold tracking-tight">AI Şarkı Sözü ve Stil Yazarı</h3>
                <p class="text-xs text-zinc-500 font-medium">Google Gemini AI Destekli</p>
            </div>
            <button onclick="closeAiLyricModal()" class="text-zinc-500 hover:text-white transition"><i class="fa-solid fa-xmark text-sm"></i></button>
        </div>
        <div class="space-y-4">
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-widest text-zinc-500 mb-2">Şarkı Konusu veya Teması</label>
                <textarea id="aiLyricTopic" class="shadcn-input w-full px-4 py-2.5 text-sm resize-y" rows="3" placeholder="Örn: Yağmurlu bir saniyede tren istasyonunda veda eden iki sevgili..."></textarea>
            </div>
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-widest text-zinc-500 mb-2">Müzik Tarzı / His İpucu (Opsiyonel)</label>
                <input type="text" id="aiLyricStyleHint" class="shadcn-input w-full px-4 py-2.5 text-sm" placeholder="Örn: Akustik Gitar, Duygusal, Slow Pop">
            </div>
            
            <div id="aiLyricStatus" class="hidden p-3 bg-zinc-900 border border-zinc-800 rounded-lg flex items-center gap-3 text-xs text-zinc-400">
                <i class="fa-solid fa-spinner fa-spin text-violet-400"></i>
                <span id="aiLyricStatusText">Sözler ve stil tasarlanıyor, lütfen bekleyin...</span>
            </div>
        </div>
        <div class="flex gap-2 mt-8">
            <button onclick="closeAiLyricModal()" class="shadcn-button-secondary flex-1 py-2.5 text-sm">İptal</button>
            <button id="btnGenerateAiLyrics" onclick="generateAiLyrics()" class="shadcn-button-primary flex-1 py-2.5 text-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles text-xs"></i> Oluştur
            </button>
        </div>
    </div>
</div>
